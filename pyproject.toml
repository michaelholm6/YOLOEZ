[project]
name = "YOLOEZ"
version = "0.7.0"
description = "No-code GUI application for labeling image datasets, training YOLO11 models, and running inference"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    { name = "Michael Holm" },
    { name = "Guang Lin" },
]

keywords = [
    "computer vision",
    "object detection",
    "image segmentation",
    "YOLO",
    "graphical user interface",
    "machine learning",
    "no-code",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # Core runtime dependencies
    "albumentations>=2.0.8",
    "keyboard>=0.13.5",
    "opencv-python>=4.13.0.90",
    "pyqtgraph>=0.14.0",
    "scikit-learn>=1.8.0",
    "ultralytics>=8.4.6",
    "torch==2.8.0",
]

[project.optional-dependencies]

# Development / CI / formatting
# PyQt5 is required to run YOLOEZ, but is declared here rather than among the core
# dependencies because uv cannot install it on Windows: pyqt5-qt5 publishes no
# Windows wheels at the version uv resolves to. Windows setups install with pip,
# which selects a compatible version. See CONTRIBUTING.md for the setup steps.
dev = [
    "pyqt5>=5.15.11",
    "black>=26.1.0",
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "pre-commit>=4.0.0",
    "pyinstaller>=6.18.0",
    "pytest-cov>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/michaelholm6/YOLOEZ"
Repository = "https://github.com/michaelholm6/YOLOEZ"
Issues = "https://github.com/michaelholm6/YOLOEZ/issues"
